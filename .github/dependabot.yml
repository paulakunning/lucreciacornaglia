version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types follow the Node runtime pinned in .nvmrc, not the latest Node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # typescript-eslint (via eslint-config-next) has to support a TypeScript major first.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
